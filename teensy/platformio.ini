; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


; ---- DEFAULT: only firmware environment built (`pio run` compiles firmware for Teensy; never touches test env). ----
[platformio]
default_envs = teensy40


; ---- FIRMWARE: what actually gets flashed onto the Teensy. ----
[env:teensy40]
platform = teensy@4.18
board = teensy40
framework = arduino
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -I .pio/libdeps/native/Unity/src


; ---- TESTS: run locally (no board needs to be plugged in). ----
; Note: `-I test/mocks` puts the `test/mocks/` directory first on the include path, to use for our testing.
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    -I src
    -I test/mocks
    -I .pio/libdeps/native/Unity/src

; 1) Compile src/ into test binary (off by default) so tests exercise the real firmware code rather than a copy.
; 2) Exclude main.cpp only (has Arduino setup()/loop() entry points + MCL; each test suite supplies its own main()).
; 3) Folders named test_* treated as test suites (test/mocks/ should be ignored and used just as an include directory).
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
test_filter = test_*
